<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sharon's Dashboard</title>
<style>
:root{--ink:#302c29;--accent:#806b5d;--terracotta:#a16f57}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Segoe UI,Arial,sans-serif;transition:background-color .7s,color .7s}.glow{position:fixed;inset:0;pointer-events:none;transition:background .7s}.wrap{position:relative;max-width:1700px;margin:auto;padding:36px 48px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:1px solid rgba(0,0,0,.1);padding-bottom:28px;margin-bottom:28px}.eyebrow{text-transform:uppercase;letter-spacing:.28em;font-size:11px;color:var(--terracotta)}.clock{font:72px Georgia,serif;letter-spacing:-4px;margin:6px 0}.muted{opacity:.65}.controls{display:flex;flex-direction:column;align-items:flex-end;gap:12px}.location,.sunstrip{background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(85,67,52,.06)}.location{border-radius:999px;padding:12px 18px}.themes{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.theme-btn{border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.45);border-radius:999px;padding:7px 13px;cursor:pointer}.theme-btn.active{background:var(--accent);border-color:var(--accent);color:white}.theme-name{font-size:10px;text-transform:uppercase;letter-spacing:.18em;opacity:.45}.grid{display:grid;grid-template-columns:5fr 4fr;gap:24px}.card{border:1px solid white;border-radius:30px;padding:28px;box-shadow:0 16px 45px rgba(85,67,52,.08);backdrop-filter:blur(14px);color:#302c29}.weather{background:rgba(232,238,229,.85)}.calendar{background:rgba(255,250,244,.85)}.card h2{font:32px Georgia,serif;margin:5px 0 20px}.current{display:flex;gap:16px;align-items:center}.wicon{font-size:48px}.temp{font:50px Georgia,serif}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.metric{background:rgba(255,255,255,.5);border-radius:16px;padding:12px;font-size:12px}.detail{font-size:14px;opacity:.65;margin-top:17px}.forecast{border-top:1px solid rgba(0,0,0,.1);margin-top:18px;padding-top:14px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font-size:13px}.forecast .icon{font-size:24px;margin:4px}.days-head,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.days-head{opacity:.5;font-size:12px;margin-bottom:8px}.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:14px}.today{background:var(--accent);color:white;font-weight:700}.vacation{background:#eadbd4;color:#8b5f53;font-weight:700}.legend{border-top:1px solid #e8ddd1;margin-top:16px;padding-top:14px;font-size:12px;opacity:.7}.sunstrip{margin-top:24px;border-radius:26px;padding:16px 28px;text-align:center}.shop{margin-top:24px;max-width:590px;background:rgba(242,230,219,.85)}.item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.5);border-radius:16px;padding:12px 14px;margin:8px 0}.item span{flex:1}.item.done span{text-decoration:line-through;opacity:.45}.item button{border:0;background:none;color:#a47b6b;font-size:20px;cursor:pointer}.add{display:flex;gap:8px;margin-top:14px}.add input{flex:1;border:1px solid #dfcfc2;background:rgba(255,255,255,.55);border-radius:16px;padding:13px;font-size:15px}.add button{border:0;background:var(--accent);color:white;border-radius:16px;padding:0 17px;font-size:22px;cursor:pointer}.foot{text-align:center;margin-top:30px;opacity:.45;font-size:11px;letter-spacing:.14em;text-transform:uppercase}@media(max-width:1000px){.grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}.controls{align-items:flex-start}.themes{justify-content:flex-start}.wrap{padding:28px}.clock{font-size:58px}}
</style>
</head>
<body>
<div class="glow" id="glow"></div>
<div class="wrap">
<header class="top">
 <div><div class="eyebrow" id="greeting"></div><div class="clock" id="clock"></div><div class="muted" id="date"></div></div>
 <div class="controls"><div class="location">⌖ Madison, Wisconsin</div><div class="themes" id="themes"></div><div class="theme-name" id="themeName"></div></div>
</header>
<section class="grid">
 <div class="card weather"><div class="eyebrow" style="color:#71816e">Outside</div><h2>Madison weather</h2><div class="current"><div class="wicon" id="weatherIcon">🌤️</div><div><div class="temp" id="temp">--°</div><div class="muted" id="conditions">Loading forecast...</div></div></div><div class="metrics"><div class="metric">💧 Humidity<br><b id="humidity">--</b></div><div class="metric">〰 Wind<br><b id="wind">--</b></div><div class="metric">☂ Precip.<br><b id="precip">--</b></div></div><div class="detail" id="detail"></div><div class="forecast" id="forecast"></div></div>
 <div class="card calendar"><div class="eyebrow">This month</div><h2 id="month"></h2><div class="days-head"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div><div class="days" id="days"></div><div class="legend" id="legend">● Today &nbsp;&nbsp; <span style="color:#b88776">● Cancún · Nov 18–23</span></div></div>
</section>
<div class="sunstrip" id="sunstrip">🌅 Sunrise -- &nbsp;&nbsp; · &nbsp;&nbsp; 🌇 Sunset --</div>
<section class="card shop"><div class="eyebrow">Shopping list</div><h2>Things to buy</h2><div id="items"></div><div class="add"><input id="newItem" placeholder="Add something to buy…"><button id="addItem">+</button></div></section>
<footer class="foot">Slow mornings · clear priorities · good things ahead</footer>
</div>
<script>
const themes={cream:{name:'Cream',bg:'#f4efe8',ink:'#302c29',glow:'radial-gradient(circle at 13% 10%,rgba(190,151,116,.22),transparent 24%),radial-gradient(circle at 88% 18%,rgba(161,177,157,.25),transparent 25%)'},sage:{name:'Sage',bg:'#e8eee5',ink:'#30382f',glow:'radial-gradient(circle at 14% 12%,rgba(120,148,119,.24),transparent 28%),radial-gradient(circle at 86% 18%,rgba(213,193,161,.22),transparent 27%)'},blush:{name:'Blush',bg:'#efe3df',ink:'#3b302f',glow:'radial-gradient(circle at 15% 12%,rgba(198,132,116,.27),transparent 26%),radial-gradient(circle at 85% 18%,rgba(171,145,168,.24),transparent 27%)'},night:{name:'Night',bg:'#302d33',ink:'#eee7e1',glow:'radial-gradient(circle at 14% 10%,rgba(141,104,116,.25),transparent 27%),radial-gradient(circle at 88% 16%,rgba(90,108,98,.18),transparent 26%)'}};
let themeChoice=localStorage.getItem('dashboardTheme')||'auto';function autoTheme(){const h=new Date().getHours();if(h<9)return{name:'Morning',bg:'#f7eee5',ink:'#302c29',glow:'radial-gradient(circle at 13% 10%,rgba(232,183,145,.30),transparent 26%),radial-gradient(circle at 88% 18%,rgba(244,208,171,.24),transparent 25%)'};if(h<17)return themes.cream;if(h<20)return themes.blush;return themes.night}function applyTheme(){const t=themeChoice==='auto'?autoTheme():themes[themeChoice];document.body.style.backgroundColor=t.bg;document.body.style.color=t.ink;glow.style.background=t.glow;themeName.textContent='Theme · '+(themeChoice==='auto'?'Auto ('+t.name+')':t.name);document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.dataset.theme===themeChoice))}['auto','cream','sage','blush','night'].forEach(k=>{const b=document.createElement('button');b.className='theme-btn';b.dataset.theme=k;b.textContent=k==='auto'?'Auto':themes[k].name;b.onclick=()=>{themeChoice=k;localStorage.setItem('dashboardTheme',k);applyTheme()};document.getElementById('themes').appendChild(b)});applyTheme();setInterval(()=>{if(themeChoice==='auto')applyTheme()},60000);
function tick(){const n=new Date(),h=n.getHours();greeting.textContent=`Good ${h<12?'morning':h<18?'afternoon':'evening'}, Sharon`;clock.textContent=n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});date.textContent=n.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});month.textContent=n.toLocaleDateString([],{month:'long',year:'numeric'});renderCalendar(n)}function renderCalendar(n){days.innerHTML='';const blanks=new Date(n.getFullYear(),n.getMonth(),1).getDay(),total=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();for(let i=0;i<blanks;i++)days.append(document.createElement('div'));for(let d=1;d<=total;d++){const el=document.createElement('div');el.className='day';el.textContent=d;if(d===n.getDate())el.classList.add('today');else if(n.getFullYear()===2026&&n.getMonth()===10&&d>=18&&d<=23)el.classList.add('vacation');days.append(el)}legend.style.display=n.getFullYear()===2026&&n.getMonth()===10?'block':'none'}tick();setInterval(tick,1000);
const labels={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Cloudy',45:'Foggy',48:'Foggy',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',80:'Rain showers',81:'Rain showers',82:'Heavy showers',95:'Thunderstorms'};function icon(c){if(c===0)return'☀️';if([1,2].includes(c))return'🌤️';if(c===3)return'☁️';if([45,48].includes(c))return'🌫️';if([71,73,75].includes(c))return'❄️';if(c===95)return'⛈️';return'🌧️'}async function loadWeather(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=43.0731&longitude=-89.4012&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FChicago&forecast_days=4');if(!r.ok)throw new Error();const d=await r.json(),c=d.current,x=d.daily;temp.textContent=Math.round(c.temperature_2m)+'°';conditions.textContent=labels[c.weather_code]||'Current conditions';weatherIcon.textContent=icon(c.weather_code);humidity.textContent=c.relative_humidity_2m+'%';wind.textContent=Math.round(c.wind_speed_10m)+' mph';precip.textContent=x.precipitation_probability_max[0]+'%';detail.textContent=`Feels like ${Math.round(c.apparent_temperature)}° · High ${Math.round(x.temperature_2m_max[0])}° · Low ${Math.round(x.temperature_2m_min[0])}°`;forecast.innerHTML=[1,2,3].map(i=>`<div>${new Date(x.time[i]+'T12:00').toLocaleDateString([],{weekday:'short'})}<div class="icon">${icon(x.weather_code[i])}</div><b>${Math.round(x.temperature_2m_max[i])}°</b> <span class="muted">${Math.round(x.temperature_2m_min[i])}°</span><div style="color:#6c8f99">${x.precipitation_probability_max[i]}%</div></div>`).join('');sunstrip.innerHTML=`🌅 <b>Sunrise</b> ${new Date(x.sunrise[0]).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})} &nbsp;&nbsp; · &nbsp;&nbsp; 🌇 <b>Sunset</b> ${new Date(x.sunset[0]).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}`}catch{conditions.textContent='Weather unavailable'}}loadWeather();setInterval(loadWeather,15*60*1000);
const KEY='dashboardBuyList';let shopping;try{shopping=JSON.parse(localStorage.getItem(KEY))||[{text:'Adjustable footrest',done:false},{text:'Hot cocoa',done:false}]}catch{shopping=[{text:'Adjustable footrest',done:false},{text:'Hot cocoa',done:false}]}function save(){localStorage.setItem(KEY,JSON.stringify(shopping))}function renderItems(){items.innerHTML='';shopping.forEach((x,i)=>{const row=document.createElement('div');row.className='item'+(x.done?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=x.done;cb.onchange=()=>{x.done=cb.checked;save();renderItems()};const s=document.createElement('span');s.textContent=x.text;const b=document.createElement('button');b.textContent='×';b.onclick=()=>{shopping.splice(i,1);save();renderItems()};row.append(cb,s,b);items.append(row)})}function addShoppingItem(){const v=newItem.value.trim();if(!v)return;shopping.push({text:v,done:false});newItem.value='';save();renderItems()}addItem.onclick=addShoppingItem;newItem.onkeydown=e=>{if(e.key==='Enter')addShoppingItem()};renderItems();
</script>
</body>
</html>
